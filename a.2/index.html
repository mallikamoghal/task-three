<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Squid Game Clone</title>

  <!-- FONT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- ICONS -->
  <link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css">

</head>

<body>



  <!-- MAIN -->
  <section class="main">



    <!-- NAVBAR -->
    <nav class="navbar">

      <!-- LOGO -->
      <div class="logo">

        <span class="white">SQUID</span>
        <span class="pink">GAME</span>

      </div>



      <!-- NAV LINKS -->
      <ul class="nav-links">

        <li><a href="#">About</a></li>

        <li><a class="active" href="#">Watch now</a></li>

        <li><a href="#">Actors</a></li>

        <li><a href="#">Contact</a></li>

      </ul>



      <!-- MENU -->
      <div class="menu">

        <i class="ri-menu-line"></i>

      </div>

    </nav>





    <!-- HERO -->
    <div class="hero">



      <!-- LEFT -->
      <div class="left">



        <!-- TITLE -->
<div class="title-image">

  <img
    src="./images/logo.png"
    alt="Squid Game Logo"
  >

</div>



        <!-- DESCRIPTION -->
        <p>
          Action / Thriller / Drama Series directed by Dong-hyuk Hwang
          <br>
          Season 1: 9 Episodes
        </p>



        <!-- BUTTONS -->
        <div class="buttons">

          <button class="play-btn">

            <i class="ri-play-circle-fill"></i>
            Play Now

          </button>



          <button class="trailer-btn">

            <i class="ri-play-mini-line"></i>
            Watch Trailer

          </button>

        </div>

      </div>





      <!-- RIGHT -->
      <div class="right">

        <img
          src="./images/charactor.png"
          alt="guard"
        >

      </div>

    </div>





    <!-- SCROLL -->
    <div class="scroll-text">

      SCROLL

    </div>





    <!-- SOCIAL -->
    <div class="social-icons">

      <i class="ri-twitter-x-line"></i>

      <i class="ri-instagram-line"></i>

      <i class="ri-facebook-line"></i>

    </div>





    <!-- SIDE TEXT -->
    <div class="side-text">

      SQUID

    </div>





    <!-- BIG BG TEXT -->
    <div class="bg-text">

      GAME

    </div>





    <!-- CARDS -->
    <div class="cards">



      <!-- CARD 1 -->
      <div class="card">

        <img
          src="./images/image-1.jpg"
          alt=""
        >

        <div class="play">

          <i class="ri-play-fill"></i>

        </div>

      </div>





      <!-- CARD 2 -->
      <div class="card">

        <img
          src="./images/image-2.jpg"
          alt=""
        >

        <div class="play">

          <i class="ri-play-fill"></i>

        </div>

      </div>





      <!-- CARD 3 -->
      <div class="card">

        <img
          src="./images/image-3.jpg"
          alt=""
        >

        <div class="play">

          <i class="ri-play-fill"></i>

        </div>

      </div>

    </div>

  </section>

</body>
</html>
